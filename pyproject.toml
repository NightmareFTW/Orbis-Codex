[project]
name = "orbis-codex"
dynamic = ["version"]
description = "E7 Arena Companion: local, read-only roster tracker and Arena win-probability overlay for Epic Seven."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "NightmareFTW" }]
classifiers = [
    "Private :: Do Not Upload",
    "Programming Language :: Python :: 3.12",
    "Operating System :: Microsoft :: Windows",
]
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "mss>=10.2",
    "numpy>=2",
    "onnxruntime>=1.20",
    "opencv-python-headless>=4.10",
    "platformdirs>=4.2",
    "pydantic>=2.7",
    "rapidocr>=3.9,<4",
    "sqlalchemy>=2.0.30",
    "typer>=0.12",
]

[project.scripts]
e7 = "e7ac.cli.app:main"

[dependency-groups]
dev = [
    "hypothesis>=6.100",
    "mypy>=1.10",
    "pytest>=8.2",
    "ruff>=0.5",
]

[tool.uv]
# rapidocr depends on the GUI build `opencv-python`; we use the headless build (no Qt plugin clash with PySide6),
# which provides the same `cv2` module. The impossible marker drops the GUI build from the lock.
override-dependencies = ["opencv-python; sys_platform == 'never'"]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/e7ac/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/e7ac"]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["spikes"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "N",        # pep8-naming
    "UP",       # pyupgrade
    "B",        # bugbear
    "SIM",      # simplify
    "PTH",      # use pathlib
    "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]
warn_unreachable = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true  # no type information shipped; only imported to check it loads

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "windows: needs Windows (skipped elsewhere)",
    "fixtures(*paths): needs git-ignored files under fixtures/ (skipped when any is missing; see tests/markers.py)",
    "network: talks to the network (skipped unless E7AC_NETWORK_TESTS=1)",
]
