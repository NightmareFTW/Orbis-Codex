# Shepherd of the Dark Diene
hero = "c2076"
source = "in-game skill popups read by the Skill reader (the user's skills folder, 2026-11-09, the Journal's Preview Skills): S1, S2 and S3 at +0 with their enhancement steps and effect panels; multipliers and target counts from Fribbels' skill data (community)"
status = "verified"
replace = [1, 2, 3]
handles = ["Seal", "Immortal", "Dual Attack"]
cooldowns = { 2 = 0, 3 = 4 }  # S3 "5 turns" on the popup read at +0; its +3 step is -1 turn; S2 is a passive
unmodelled = [
    "S1 Rupture for 1 turn (additional damage in proportion to max Health when attacked: no number, NV-71)",
    "S2 Dark Moon (after someone uses a Soulburn: dispels two buffs from all enemies, immortality for 3 turns, Combat Readiness +35%): Soulburn is never used here",
    "S3 ignores Effect Resistance while she is immortal",
    "S1 and S3 Soulburn (20 and 10 Souls): more damage (Souls are not simulated)",
]

# S1 Crimson Claws: "After inflicting rupture on the enemy for 1 turn, attacks the enemy. A successful attack always results
# in a critical hit. ... When the caster is granted immortality, triggers a Dual Attack from the ally with the highest Attack."
[passive]
always_crit = [1, 3]

[[effect]]
slot = 1
kind = "dual_attack"
receivers = "highest_atk"
condition = "immortal"
note = "S1: while she is immortal the ally with the highest Attack follows with a basic attack"

# S2 Noias's Guidance (passive): "At the start of battle, grants immortality for 1 turn. When granted immortality, increases
# Effect Resistance by 200%."
[[effect]]
slot = 2
when = "start"
kind = "immortal"
turns = 1
note = "S2: immortality for 1 turn at the start of the battle"

[[effect]]
slot = 2
when = "start"
kind = "res"
value = 2.0
turns = 1
note = "S2: Effect Resistance +200% while that immortality lasts"

# S3 Endless Darkness (5 turns at +0, 4 at +3): "After inflicting seal on all enemies for 2 turns, attacks them and decreases
# Combat Readiness by 30%. A successful attack always results in a critical hit."
[[effect]]
slot = 3
when = "before"
kind = "seal"
turns = 2
note = "S3: seal on all enemies for 2 turns before the attack"

[[effect]]
slot = 3
kind = "cr"
value = -0.3
note = "S3: decreases Combat Readiness by 30%"
