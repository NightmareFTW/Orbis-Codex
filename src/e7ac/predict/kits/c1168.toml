# pilfer (Attack, Defense and Health down 20%; the caster gains a Spoils stack: +20% each, up to 4), then increased
# Attack (50%) to the caster for 2 turns and an extra turn.
[[effect]]
slot = 2
kind = "dispel"
count = 0
note = "S2: dispels all buffs of the target"

[[effect]]
slot = 2
