# Spirit Eye Celine
hero = "c2103"
source = "in-game skill popups read by the Skill reader (the user's export, 2026-10-26): S1, S2 and S3 at +0 with their enhancement steps, applied to the maximum; Nimble Sword's multiplier and 50% penetration from Fribbels' skill data (her 'S2: S1 proc': community, the 50% agrees with the popup); the 51% limit agrees with epic7db's text"
status = "verified"
replace = [1, 3]
handles = ["Penetrate", "Possession", "Decrease Skill Cooldown", "Immortal", "Revive"]
cooldowns = { 3 = 5 }  # "6 turns" at +0, "-1 turn cooldown" at +1 (maximum)
unmodelled = [
    "S1 Nimble Sword absorbs \"some of the damage dealt as Health\" (no number on the popup)",
    "S3 Spirit Gate revives all dead allies: the popup gives no Health share, so the revive is left out (a team that has lost a hero before her S3 is under-estimated)",
    "Possession's counterattack when she suffers a critical hit (a reaction does not know the type of the hit)",
    "Soulburn (S1: an extra turn for 20 Souls) and the 5 Souls gained when somebody dies: Souls are not simulated",
    "Sixth Sense's cooldown cut works once per turn at most (the game); here on every death",
]

# S1 Mighty Strike: an attack with a sheath. When the caster has a buff (and the skill was not triggered by a Dual Attack)
# it is Nimble Sword: increased Attack (50%) to the caster for 1 turn, then a swift attack that absorbs some of the damage
# as Health and penetrates 50% of the target's Defense (Fribbels: pow 0.9, rate 1, penetration 0.5, listed as her "S2").
# Enhancements: +5% damage dealt at +1..+6, +10% at +7 (not applied to the multiplier).

# S2 Sixth Sense (passive): "When attacked, damage suffered in one attack does not exceed 70% of max Health"; the steps
# take 2, 2, 2, 3, 3, 3 and 4% off that limit (19 in all): 51% at +7, the number epic7db shows. When someone dies,
# decreases skill cooldowns by 1 turn and gains 5 Soul.
[passive]
hit_cap = 0.51
variant_slot = 2
death_cd = 1

[[effect]]
slot = 1
when = "variant"
kind = "atk"
value = 0.5
turns = 1
note = "Nimble Sword: increased Attack (50%) to the caster for 1 turn before the attack"

# S3 Spirit Gate: Burning Possession (5 turns at +1): revives all dead allies (not modelled: no Health share given),
# grants immortality to all allies for 1 turn and possession to the caster for 3 turns (Attack +25%; it counterattacks
# when she suffers a critical hit: not modelled).
[[effect]]
slot = 3
kind = "immortal"
turns = 1
receivers = "all"
note = "S3: immortality to all allies for 1 turn"

[[effect]]
slot = 3
kind = "atk"
value = 0.25
turns = 3
note = "S3: possession: Increases Attack by 25% for 3 turns"
