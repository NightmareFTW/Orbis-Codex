# caster's max Health (Fribbels: selfHpScaling 0.1). As God of Battle it adds damage proportional to max Health.
[[effect]]
slot = 1
kind = "def"
value = -0.7
turns = 1
chance = 0.75
note = "S1: 75% chance to inflict decreased Defense (70%) for 1 turn"

