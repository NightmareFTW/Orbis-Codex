# Yulha
hero = "c1131"
source = "S1 from the in-game skill screen (user screenshot, 2026-10-17: verified); S2 and S3 from epic7db skill text and Fribbels skill options"
status = "community"
replace = [2]
handles = ["Redirected Provoke", "S2 cr", "S2 barrier", "S2 cleanse", "Penetrate"]
# S1 "redirected provoke" from the in-game screen (the user's screenshot, 2026-10-17: verified): 85% chance at +0, +5% at
# +2 and +10% at +4 (100% at max enhancement), 1 turn; "at the start of the turn, forcibly uses basic skill on the enemy
# with the highest max Health".
# S3's 100% penetration comes from Fribbels (already in the damage), so "Penetrate" is handled.

[passive]
reflect = 0.4
low_hp = 0.3
low_hp_cooldown = 5

[[effect]]
slot = 1
kind = "redirect_provoke"
chance = 1.0
turns = 1
note = "S1: redirected provoke for 1 turn (100% at max enhancement: 85% + 5% + 10%)"

[[effect]]
slot = 2
when = "low_hp"
kind = "cleanse"
receivers = "self"
count = 0
note = "S2 Murderous Intent: dispels all debuffs from the caster"

[[effect]]
slot = 2
when = "low_hp"
kind = "barrier"
scaling = [0.35, 0, 0]
turns = 3
receivers = "self"
note = "S2 Murderous Intent: barrier for 3 turns (35% max Health: Fribbels)"

[[effect]]
slot = 2
when = "low_hp"
kind = "cr"
value = 0.25
note = "S2 Murderous Intent: +25% Combat Readiness"
