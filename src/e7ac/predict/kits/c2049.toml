# Maid Chloe
hero = "c2049"
source = "S1 and S3 from the in-game skill screens (the user's screenshots, 2026-10-17: verified); S2 from epic7db skill text and Fribbels skill options"
status = "community"
replace = [1, 3]
handles = ["Revive"]
cooldowns = { 3 = 4 }
# epic7db is out of date for S3: it says 20% Health, a 6-turn cooldown and an Attack icon; the game says 30%, 4 turns
# (skill at +1) and Increase Defense by 60% (docs/SPEC.md D77).

# S1 Heavy Strike (in-game screen, +7): 40% chance to stun for 1 turn, before increasing the caster's Combat Readiness by
# 15%; after attacking, when the target is inflicted with stun, +15% Combat Readiness to all allies except the caster.
# Soulburn (20 Soul: extra turn) is not simulated: Souls are not.

