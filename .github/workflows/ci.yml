name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Qt system libraries (the window tests run offscreen)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Tests
        run: uv run pytest

  launcher:
    # Simulates a clean user PC: uv must be absent (the launcher installs it) and uv must download
    # its own CPython 3.12 instead of reusing the runner's preinstalled Python.
    name: launcher smoke test (windows, clean-machine path)
    runs-on: windows-latest
    env:
      UV_PYTHON_PREFERENCE: only-managed
    steps:
      - uses: actions/checkout@v7
      - name: Assert uv is not preinstalled (so the install path is really exercised); isolate the app home
        shell: pwsh
        run: |
          if (Get-Command uv -ErrorAction SilentlyContinue) { throw 'uv is preinstalled on the runner; install path not tested' }
          "E7AC_HOME=$env:RUNNER_TEMP\e7home" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: .\OrbisCodex.cmd --version (installs uv, downloads Python 3.12, syncs locked deps)
        shell: cmd
        run: call .\OrbisCodex.cmd --version
      - name: doctor passes and runs on a uv-managed interpreter
        shell: cmd
        run: |
          call .\OrbisCodex.cmd doctor || exit /b 1
          rem uv-managed interpreters live in ...\uv\python\cpython-3.12.*; the runner's own Python does not match.
          call .\OrbisCodex.cmd doctor | findstr /i /c:"cpython-3.12"
      - name: arguments reach e7 verbatim (quoted value with spaces)
        shell: cmd
        run: |
          call .\OrbisCodex.cmd config set resolution " 2560 x 1440 " || exit /b 1
          call .\OrbisCodex.cmd config show | findstr /c:"2560x1440"
      - name: invalid value fails with exit code 2
        shell: cmd
        run: |
          call .\OrbisCodex.cmd config set world nowhere
          if not "%ERRORLEVEL%"=="2" exit /b 1
          exit /b 0
      - name: the desktop shortcut is made by PowerShell (windowless Python, the program's icon)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmd /c ".\OrbisCodex.cmd shortcut"
          if ($LASTEXITCODE -ne 0) { throw "e7 shortcut exited with $LASTEXITCODE" }
          $link = Join-Path ([Environment]::GetFolderPath('Desktop')) 'Orbis Codex.lnk'
          if (-not (Test-Path $link)) { throw "no shortcut at $link" }
          $s = (New-Object -ComObject WScript.Shell).CreateShortcut($link)
          "target: $($s.TargetPath)  arguments: $($s.Arguments)  icon: $($s.IconLocation)"
          if ($s.TargetPath -notlike '*\pythonw.exe') { throw 'the shortcut does not start the windowless Python' }
          if ($s.Arguments -ne '-m e7ac.ui') { throw 'the shortcut does not open the window' }
          if ($s.IconLocation -notlike '*\orbis.ico,0') { throw 'the shortcut has no icon file' }
          if (-not (Test-Path (Join-Path $env:E7AC_HOME 'orbis.ico'))) { throw 'no icon file in the data folder' }
      - name: Orbis.cmd opens the window with no console (it runs on its own, writes its log and its icon line)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          cmd /c ".\Orbis.cmd"
          if ($LASTEXITCODE -ne 0) { throw "Orbis.cmd exited with $LASTEXITCODE" }
          $log = Join-Path $env:E7AC_HOME 'logs\app.log'
          $end = (Get-Date).AddSeconds(120)
          while (-not ((Test-Path $log) -and (Select-String -Path $log -Pattern 'icon:' -Quiet)) -and (Get-Date) -lt $end) { Start-Sleep -Seconds 1 }
          if (Test-Path $log) { Get-Content $log }
          if (-not (Test-Path $log) -or -not (Select-String -Path $log -Pattern 'icon:' -Quiet)) { throw 'the window did not start' }
          Get-Process pythonw -ErrorAction Stop | Stop-Process -Force
