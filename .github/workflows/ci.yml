name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install (locked)
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest

  launcher:
    name: launcher smoke test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: OrbisCodex.cmd --version (installs uv if missing)
        shell: cmd
        run: OrbisCodex.cmd --version
      - name: OrbisCodex.cmd doctor
        shell: cmd
        run: OrbisCodex.cmd doctor
